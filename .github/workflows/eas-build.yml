name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'المنصة'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, all]
      profile:
        description: 'EAS profile'
        required: true
        default: 'preview'
        type: choice
        options: [development, preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_ANDROID_GOOGLE_SERVICES_FILE: ./google-services.json
      EXPO_PUBLIC_IOS_GOOGLE_SERVICES_FILE: ./GoogleService-Info.plist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Restore Firebase config files
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > google-services.json
          if [ -n "${{ secrets.GOOGLE_SERVICES_PLIST_B64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_PLIST_B64 }}" | base64 -d > GoogleService-Info.plist
          fi

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS Build
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform }} \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --no-wait
